    name: Sync Fork with Upstream

    # 触发条件：每天UTC时间2点自动运行一次，也可以手动触发
    on:
      schedule:
        - cron: '0 */3 * * *'  # 每天2点执行，可调整频率如每6小时: '0 */6 * * *'
      workflow_dispatch:     # 允许在Actions页面手动触发

    jobs:
      sync:
        runs-on: ubuntu-latest
        steps:
          # 步骤1: 检出你的fork仓库代码
          - name: Checkout Fork
            uses: actions/checkout@v4
            with:
              ref: main  # 指定要同步的分支，通常是 main 或 master
              fetch-depth: 0  # 获取完整历史，避免合并问题

          # 步骤2: 添加上游仓库为远程源并拉取最新代码
          - name: Sync with Upstream
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
              git fetch upstream
              git merge upstream/main --ff-only || echo "No new commits to sync"
              git push origin main
    
